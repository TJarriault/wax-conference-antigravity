{{- if .Values.networkPolicy.enabled -}}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "golden-retriever-blog.fullname" . }}
  labels:
    {{- include "golden-retriever-blog.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "golden-retriever-blog.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from: []
      ports:
        - protocol: TCP
          port: {{ .Values.service.targetPort }}
  egress:
    - ports:
        - protocol: TCP
          port: {{ .Values.database.port }}
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
{{- end }}
