# Default values for golden-retriever-blog Helm chart.

replicaCount: 2

image:
  repository: europe-west1-docker.pkg.dev/my-gcp-project-id/golden-blog-repo/golden-retriever-blog
  pullPolicy: IfNotPresent
  tag: "v1.0.0"

nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  name: "golden-blog-sa"
  annotations: {}

podAnnotations: {}

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 10001
  runAsGroup: 10001
  fsGroup: 10001
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: false
  capabilities:
    drop:
      - ALL

service:
  type: LoadBalancer
  port: 80
  targetPort: 8080

database:
  host: "10.10.0.5" # Replace with your Cloud SQL Private IP
  port: 5432
  name: "golden_blog"
  user: "blog_user"
  password: "REPLACE_WITH_GENERATED_DB_PASSWORD"
  existingSecret: "" # Set if referencing an existing secret key

resources:
  limits:
    cpu: 500m
    memory: 512Mi
  requests:
    cpu: 250m
    memory: 512Mi

livenessProbe:
  httpGet:
    path: /healthz
    port: 8080
  initialDelaySeconds: 10
  periodSeconds: 15
  timeoutSeconds: 3
  failureThreshold: 3

readinessProbe:
  httpGet:
    path: /healthz
    port: 8080
  initialDelaySeconds: 5
  periodSeconds: 10
  timeoutSeconds: 3
  failureThreshold: 2

networkPolicy:
  enabled: true

nodeSelector: {}
tolerations: []
affinity: {}
