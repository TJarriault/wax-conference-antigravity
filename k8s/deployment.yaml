apiVersion: apps/v1
kind: Deployment
metadata:
  name: golden-blog-app
  namespace: golden-blog
  labels:
    app.kubernetes.io/name: golden-blog-app
    app.kubernetes.io/component: frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: golden-blog-app
  template:
    metadata:
      labels:
        app: golden-blog-app
    spec:
      serviceAccountName: golden-blog-sa
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: blog-app
          image: europe-west1-docker.pkg.dev/my-gcp-project-id/golden-blog-repo/golden-retriever-blog:v1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
              name: http
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          envFrom:
            - configMapRef:
                name: golden-blog-config
          env:
            - name: DB_PASS
              valueFrom:
                secretKeyRef:
                  name: golden-blog-secret
                  key: DB_PASS
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 2
